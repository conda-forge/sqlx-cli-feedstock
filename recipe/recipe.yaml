schema_version: 1

context:
  version: "0.9.0"

package:
  name: sqlx-cli
  version: ${{ version }}

source:
  url: https://github.com/launchbadge/sqlx/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 48eaacc9a800af48c35713d300bc0de0c1e04b84c810b25de1007806fa1d718c

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - if: unix
      then: openssl

tests:
  - requirements:
      run:
        - ${{ compiler('rust') }}
    script:
      - sqlx --version
      - sqlx --help
      - cargo sqlx --help

about:
  license: Apache-2.0
  summary: Command-line utility for SQLx, the Rust SQL toolkit.
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT
    - THIRDPARTY.yml
  homepage: https://github.com/launchbadge/sqlx

extra:
  recipe-maintainers:
    - borchero
    - danielnachun
